plugins {
    id "com.android.application"
}

android {
    namespace "com.hipermercadokristal.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.hipermercadokristal.app"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    flavorDimensions "edition"
    productFlavors {
        client {
            dimension "edition"
            manifestPlaceholders = [launchUrl: "https://hipermercadokristal.github.io/"]
            resValue "string", "app_name", "Hipermercado Kristal"
        }
        delivery {
            dimension "edition"
            applicationIdSuffix ".delivery"
            manifestPlaceholders = [launchUrl: "https://hipermercadokristal.github.io/delivery/"]
            resValue "string", "app_name", "Kristal Reparto"
        }
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("ANDROID_KEYSTORE_PATH") ?: "release-key.p12")
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias "kristal"
            keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            storeType "PKCS12"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}
