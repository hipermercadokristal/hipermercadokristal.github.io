<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f3822" />
    <meta name="description" content="Acceso seguro a Hipermercado Kristal. El sistema abre el módulo según el rol de tu cuenta." />
    <title>Iniciar sesión | Hipermercado Kristal</title>
    <link rel="icon" type="image/png" href="/assets/kristal-favicon.png" />
    <link rel="stylesheet" href="/login/login.css" />
    <script src="/supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/supabase-client.js"></script>
    <script src="/auth-routing.js" defer></script>
    <script src="/login/login.js" defer></script>
  </head>
  <body>
    <main class="login-shell">
      <a class="login-brand" href="/" aria-label="Volver a Hipermercado Kristal">
        <img src="/assets/kristal-logo.png" alt="Hipermercado Kristal" />
      </a>
      <section class="login-card" aria-labelledby="login-heading">
        <p class="eyebrow">ACCESO SEGURO</p>
        <h1 id="login-heading">Iniciar sesión</h1>
        <p class="intro">Usa tu cuenta de Kristal. Te llevaremos automáticamente a la tienda, caja, reparto o administración según el rol asignado.</p>
        <form id="login-form">
          <label for="login-email">Correo electrónico</label>
          <input id="login-email" name="email" type="email" autocomplete="username" required />
          <label for="login-password">Contraseña</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" required />
          <button class="primary-button" type="submit">Continuar con correo</button>
        </form>
        <div class="separator"><span>o</span></div>
        <button class="google-button" id="google-sign-in-button" type="button">Continuar con Google</button>
        <p class="status" id="login-status" role="status" aria-live="polite"></p>
      </section>
      <a class="back-link" href="/">← Volver a la tienda</a>
    </main>
  </body>
</html>
