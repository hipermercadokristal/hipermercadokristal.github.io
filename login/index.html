<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f3822" />
    <meta name="description" content="Acceso seguro a Hipermercado Kristal. El sistema abre el módulo según el rol de tu cuenta." />
    <title>Iniciar sesión | Hipermercado Kristal</title>
    <link rel="icon" type="image/png" href="/assets/kristal-favicon.png" />
    <link rel="stylesheet" href="/login/login.css?v=role-tabs-google-logo-20261017" />
    <script src="/supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/supabase-client.js"></script>
    <script src="/auth-routing.js?v=role-routing-v2-20261017" defer></script>
    <script src="/login/login.js?v=role-tabs-google-logo-20261017" defer></script>
  </head>
  <body>
    <main class="login-shell">
      <section class="login-card" aria-labelledby="login-heading">
        <div class="login-card-brand">
          <img src="/assets/kristal-logo.png" alt="" />
          <div><p class="eyebrow">HIPERMERCADO KRISTAL</p><h1 id="login-heading">Iniciar sesión</h1></div>
        </div>
        <p class="eyebrow">ACCESO SEGURO</p>
        <p class="intro">Usa tu cuenta de Kristal. Te llevaremos automáticamente a la tienda, caja, reparto o administración según el rol asignado.</p>
        <nav class="role-tabs" aria-label="Seleccionar módulo">
          <button type="button" data-role-choice="client">Cliente</button>
          <button type="button" data-role-choice="operator">Caja</button>
          <button type="button" data-role-choice="courier">Delivery</button>
          <button type="button" data-role-choice="admin">Administrador</button>
        </nav>
        <p class="role-note">Tu cuenta solo abrirá el módulo autorizado por el administrador.</p>
        <form id="login-form">
          <label for="login-email">Correo electrónico</label>
          <input id="login-email" name="email" type="email" autocomplete="username" required />
          <label for="login-password">Contraseña</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" required />
          <button class="primary-button" type="submit">Entrar</button>
        </form>
        <div class="separator"><span>o</span></div>
        <button class="google-button" id="google-sign-in-button" type="button">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5Z" transform="translate(0 4)" /><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.75 7.18l7.73 6C44.42 38.03 46.98 31.9 46.98 24.55Z" /><path fill="#FBBC05" d="M10.53 28.59a14.4 14.4 0 0 1 0-9.18l-7.98-6.19a23.9 23.9 0 0 0 0 21.56l7.98-6.19Z" transform="translate(0 4)" /><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.91-5.8l-7.73-6c-2.14 1.45-4.88 2.3-8.18 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48Z" transform="translate(0 -4)" /></svg>
          Continuar con Google
        </button>
        <p class="status" id="login-status" role="status" aria-live="polite"></p>
      </section>
      <a class="back-link" href="/">← Volver a la tienda</a>
    </main>
  </body>
</html>
