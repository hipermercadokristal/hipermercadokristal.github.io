name: Deploy Hipermercado Kristal to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build signed release APK and Digital Asset Links
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.p12
          ANDROID_KEYSTORE_PATH="$PWD/release-key.p12" gradle --no-daemon assembleRelease
          mkdir -p ../android-publish
          cp app/build/outputs/apk/client/release/app-client-release.apk ../android-publish/hipermercado-kristal.apk
          cp app/build/outputs/apk/delivery/release/app-delivery-release.apk ../android-publish/kristal-reparto.apk
          fingerprint="$(keytool -list -v -keystore release-key.p12 -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias kristal | awk -F': ' '/SHA256:/{print $2; exit}')"
          if [ -z "$fingerprint" ]; then
            echo "Could not read the release certificate SHA-256 fingerprint."
            exit 1
          fi
          printf '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"com.hipermercadokristal.app","sha256_cert_fingerprints":["%s"]}},{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"com.hipermercadokristal.app.delivery","sha256_cert_fingerprints":["%s"]}}]\n' "$fingerprint" "$fingerprint" > ../android-publish/assetlinks.json
          rm release-key.p12
        working-directory: android

      - name: Build debug APK for testing when release secrets are not configured
        if: env.ANDROID_KEYSTORE_BASE64 == '' || env.ANDROID_KEYSTORE_PASSWORD == ''
        run: |
          gradle --no-daemon assembleDebug
          mkdir -p ../android-publish
          cp app/build/outputs/apk/client/debug/app-client-debug.apk ../android-publish/hipermercado-kristal.apk
          cp app/build/outputs/apk/delivery/debug/app-delivery-debug.apk ../android-publish/kristal-reparto.apk
        working-directory: android

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: kristal-android-apk
          path: android-publish/
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: android-apk
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: kristal-android-apk
          path: android-publish

      - name: Prepare Android APK download
        run: |
          mkdir -p downloads
          mv android-publish/hipermercado-kristal.apk downloads/hipermercado-kristal.apk
          mv android-publish/kristal-reparto.apk downloads/kristal-reparto.apk
          if [ -f android-publish/assetlinks.json ]; then
            mkdir -p .well-known
            mv android-publish/assetlinks.json .well-known/assetlinks.json
            touch .nojekyll
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
